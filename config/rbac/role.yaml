apiVersion: v1
kind: ServiceAccount
metadata:
  name: fqdn-network-policy-controller
  namespace: fqdn-network-policy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fqdn-network-policy-controller
rules:
  - apiGroups: ["netsec.yourorg.io"]
    resources: ["fqdnnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["netsec.yourorg.io"]
    resources: ["fqdnnetworkpolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fqdn-network-policy-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fqdn-network-policy-controller
subjects:
  - kind: ServiceAccount
    name: fqdn-network-policy-controller
    namespace: fqdn-network-policy-system
