apiVersion: v1
kind: Namespace
metadata:
  name: fqdn-network-policy-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fqdn-network-policy-controller
  namespace: fqdn-network-policy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fqdn-network-policy-controller
  namespace: fqdn-network-policy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fqdn-network-policy-controller
  template:
    metadata:
      labels:
        app: fqdn-network-policy-controller
    spec:
      serviceAccountName: fqdn-network-policy-controller
      containers:
        - name: manager
          image: fqdn-network-policy:demo
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fqdn-network-policy-snoop
  namespace: fqdn-network-policy-system
spec:
  # Only used when the controller is started with --enable-snoop-resolver.
  # Point CoreDNS's forward plugin at this service (port 5353/UDP) so the
  # controller sees actual pod DNS responses. See internal/dns/snoop_resolver.go.
  selector:
    app: fqdn-network-policy-controller
  ports:
    - name: dns-snoop
      port: 5353
      protocol: UDP
      targetPort: 5353
