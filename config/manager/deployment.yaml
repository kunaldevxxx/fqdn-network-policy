apiVersion: v1
kind: Namespace
metadata:
  name: fqdn-network-policy-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fqdn-network-policy-controller
  namespace: fqdn-network-policy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fqdn-network-policy-controller
  namespace: fqdn-network-policy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fqdn-network-policy-controller
  template:
    metadata:
      labels:
        app: fqdn-network-policy-controller
    spec:
      serviceAccountName: fqdn-network-policy-controller
      containers:
        - name: manager
          image: fqdn-network-policy:demo
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
