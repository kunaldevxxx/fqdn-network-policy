apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fqdnnetworkpolicies.netsec.yourorg.io
spec:
  group: netsec.yourorg.io
  names:
    kind: FQDNNetworkPolicy
    listKind: FQDNNetworkPolicyList
    plural: fqdnnetworkpolicies
    singular: fqdnnetworkpolicy
    shortNames:
      - fqdnnp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Generated
          type: string
          jsonPath: .status.generatedNetworkPolicy
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [podSelector, egress]
              properties:
                podSelector:
                  type: object
                  properties:
                    podSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                egress:
                  type: array
                  items:
                    type: object
                    required: [match]
                    properties:
                      match:
                        type: string
                      ports:
                        type: array
                        items:
                          type: object
                          properties:
                            protocol:
                              type: string
                              default: TCP
                            port:
                              type: integer
                resolutionTTLOverride:
                  type: integer
            status:
              type: object
              properties:
                generatedNetworkPolicy:
                  type: string
                observedGeneration:
                  type: integer
                resolvedHosts:
                  type: array
                  items:
                    type: object
                    properties:
                      hostname:
                        type: string
                      ips:
                        type: array
                        items:
                          type: string
                      lastSeen:
                        type: string
                        format: date-time
                      source:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
