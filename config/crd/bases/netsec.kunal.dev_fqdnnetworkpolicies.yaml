---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
  name: fqdnnetworkpolicies.netsec.kunal.dev
spec:
  group: netsec.kunal.dev
  names:
    kind: FQDNNetworkPolicy
    listKind: FQDNNetworkPolicyList
    plural: fqdnnetworkpolicies
    shortNames:
    - fqdnnp
    singular: fqdnnetworkpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.generatedNetworkPolicy
      name: Generated
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FQDNNetworkPolicy lets users allow-list egress by hostname on any CNI,
          by resolving hostnames to IPs and reconciling a standard NetworkPolicy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FQDNNetworkPolicySpec defines the desired state.
            properties:
              coreDNSAddress:
                description: |-
                  CoreDNSAddress is the host:port of the cluster DNS server to query
                  directly (e.g. "10.96.0.10:53"). When set, the controller resolves
                  FQDNs against cluster CoreDNS rather than the node's system resolver,
                  reducing geo-DNS divergence between the controller and workload pods.
                type: string
              egress:
                description: Egress is the list of allowed external FQDNs.
                items:
                  description: FQDNRule describes one allowed external destination.
                  properties:
                    match:
                      description: |-
                        Match is a fully qualified domain name, e.g. "api.stripe.com".
                        Wildcard patterns (*.foo.com) are accepted only when the snoop resolver
                        is active; a validation webhook rejects wildcards otherwise.
                      maxLength: 253
                      minLength: 1
                      type: string
                    ports:
                      description: |-
                        Ports restricts the rule to specific destination ports/protocols.
                        Empty means all ports. Specifying explicit ports is strongly recommended
                        to avoid opening attack vectors on unintended port numbers.
                      items:
                        description: PolicyPort mirrors networkingv1.NetworkPolicyPort
                          to avoid import coupling.
                        properties:
                          port:
                            description: Port is the destination port number (1-65535).
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                          protocol:
                            default: TCP
                            description: Protocol is TCP, UDP, or SCTP. Defaults to
                              TCP.
                            enum:
                            - TCP
                            - UDP
                            - SCTP
                            type: string
                        required:
                        - port
                        type: object
                      type: array
                  required:
                  - match
                  type: object
                minItems: 1
                type: array
              mode:
                default: Enforce
                description: |-
                  Mode controls enforcement. "Enforce" (default) creates and maintains
                  the generated NetworkPolicy. "Audit" logs what would be allowed/blocked
                  without writing any NetworkPolicy -- safe for dry-runs.
                enum:
                - Enforce
                - Audit
                type: string
              podSelector:
                description: PodSelector targets which pods in this namespace the
                  rules apply to.
                properties:
                  podSelector:
                    description: |-
                      PodSelector selects the pods this policy applies to within the namespace.
                      Empty selector means "all pods in the namespace".
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              resolutionTTLOverride:
                description: |-
                  ResolutionTTLOverride forces a re-resolution interval in seconds,
                  overriding observed DNS TTLs. Useful for flaky upstream TTLs.
                format: int32
                maximum: 300
                minimum: 5
                type: integer
              security:
                description: Security defines security-related constraints on FQDN
                  resolution.
                properties:
                  blockLinkLocal:
                    description: |-
                      BlockLinkLocal drops link-local addresses (169.254.0.0/16, fe80::/10)
                      from the resolved allow-list. Defaults to true.
                    type: boolean
                  blockLoopback:
                    description: |-
                      BlockLoopback drops loopback addresses (127.0.0.0/8, ::1/128) from the
                      resolved allow-list. Defaults to true.
                    type: boolean
                  blockPrivateIPs:
                    description: |-
                      BlockPrivateIPs drops RFC1918 (10/8, 172.16/12, 192.168/16) and CGNAT
                      (100.64/10) addresses from the resolved allow-list and raises a Degraded
                      condition. Defaults to true; set to false only in split-horizon DNS
                      environments where private egress is intentional.
                    type: boolean
                  maxCNAMEDepth:
                    description: |-
                      MaxCNAMEDepth is the maximum allowed CNAME chain length before the
                      controller raises a Degraded condition. 0 or unset means no limit.
                    format: int32
                    maximum: 10
                    minimum: 0
                    type: integer
                type: object
            required:
            - egress
            - podSelector
            type: object
          status:
            description: FQDNNetworkPolicyStatus defines the observed state.
            properties:
              conditions:
                description: |-
                  Conditions follow the standard metav1.Condition pattern.
                  Condition types: Ready, Resolving, Degraded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              generatedNetworkPolicy:
                description: |-
                  GeneratedNetworkPolicy is the name of the plain NetworkPolicy object
                  this controller manages on behalf of this resource.
                  Empty in Audit mode (no NetworkPolicy is written).
                type: string
              observedGeneration:
                description: ObservedGeneration lets us detect stale status vs spec.
                format: int64
                type: integer
              resolvedHosts:
                description: ResolvedHosts is the current resolution cache backing
                  the generated NetworkPolicy.
                items:
                  description: ResolvedHost records the last known IPs for one matched
                    hostname.
                  properties:
                    cnameChain:
                      description: |-
                        CNAMEChain holds the ordered CNAME targets from the queried hostname to
                        the final canonical name. Empty when the name resolved without CNAME indirection.
                      items:
                        type: string
                      type: array
                    hostname:
                      type: string
                    ips:
                      items:
                        type: string
                      type: array
                    lastSeen:
                      format: date-time
                      type: string
                    security:
                      description: |-
                        Security holds optional DNS security metadata for this hostname.
                        Absent when the snoop resolver is the resolution source.
                      properties:
                        dnssecValidated:
                          description: |-
                            DNSSECValidated is true when at least one upstream resolver set the
                            Authenticated Data (AD) bit, indicating the answer was DNSSEC-signed.
                            This reflects the upstream resolver's validation, not an independent chain check.
                          type: boolean
                        ipChurnRate:
                          description: |-
                            IPChurnRate is the count of distinct IPs observed for this hostname
                            across the last 10 resolution cycles. Values above 4 typically indicate
                            CDN anycast or short-TTL load balancing.
                          type: integer
                        resolverDivergence:
                          description: |-
                            ResolverDivergence is the number of IPs that appeared in fewer than
                            all resolvers queried. Zero means full agreement across resolvers.
                          type: integer
                        shortTTL:
                          description: |-
                            ShortTTL is true when the observed TTL is below the configured minimum
                            (default 10 s). Short TTLs combined with high IPChurnRate are a common
                            indicator of fast-flux DNS.
                          type: boolean
                      type: object
                    source:
                      description: |-
                        Source is "dns-snoop" when the eBPF resolver observed the answer, or
                        "active-lookup" when the controller queried DNS directly.
                      type: string
                    ttlSeconds:
                      description: TTLSeconds is the DNS TTL of the last response,
                        in seconds.
                      format: int32
                      type: integer
                  required:
                  - hostname
                  - ips
                  - lastSeen
                  - source
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
