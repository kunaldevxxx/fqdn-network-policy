---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
  name: fqdnegressobservations.netsec.kunal.dev
spec:
  group: netsec.kunal.dev
  names:
    kind: FQDNEgressObservation
    listKind: FQDNEgressObservationList
    plural: fqdnegressobservations
    shortNames:
    - fqdneo
    singular: fqdnegressobservation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.observationComplete
      name: Complete
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FQDNEgressObservation passively discovers hostnames queried anywhere in
          the cluster via the snoop resolver, to inform hand-written
          FQDNNetworkPolicy egress rules. It requires the snoop resolver to be
          active. Observations are cluster-wide, not scoped to PodSelector or this
          object's namespace -- see PodSelector's doc comment for why.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FQDNEgressObservationSpec configures passive discovery of hostnames
              resolved via DNS, so operators can write an FQDNNetworkPolicy without
              guessing. This is observation only -- it never writes a NetworkPolicy.
            properties:
              observationWindow:
                default: 24h
                description: |-
                  ObservationWindow is how long to accumulate observations before the
                  result is considered stable (see status.observationComplete).
                type: string
              podSelector:
                description: |-
                  PodSelector is accepted for forward compatibility but is not yet
                  enforced: observations are cluster-wide, not scoped to this selector
                  or even to this namespace. CoreDNS's forward plugin re-originates
                  every forwarded query as its own client, so the snoop resolver can
                  never see which pod actually asked -- see
                  internal/dns/observation_store.go for why. Narrowing by pod/namespace
                  would need either a custom CoreDNS build or a different interception
                  mechanism (eBPF/iptables), both out of scope here.
                properties:
                  podSelector:
                    description: |-
                      PodSelector selects the pods this policy applies to within the namespace.
                      Empty selector means "all pods in the namespace".
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
            required:
            - podSelector
            type: object
          status:
            description: FQDNEgressObservationStatus defines the observed state.
            properties:
              conditions:
                description: |-
                  Conditions follow the standard metav1.Condition pattern.
                  Condition types: Ready, Degraded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observationComplete:
                description: |-
                  ObservationComplete is set once ObservationWindow has elapsed since
                  this resource was created.
                type: boolean
              observedDomains:
                description: |-
                  ObservedDomains is the accumulated set of hostnames seen cluster-wide
                  (see PodSelector's doc comment for why this isn't scoped further).
                  Additive across reconciles so data survives controller restarts.
                items:
                  description: ObservedDomain records one hostname observed cluster-wide
                    via DNS.
                  properties:
                    firstSeen:
                      description: FirstSeen is when this hostname was first observed.
                      format: date-time
                      type: string
                    hostname:
                      description: Hostname is the FQDN observed in a DNS query.
                      type: string
                    lastSeen:
                      description: LastSeen is when this hostname was most recently
                        observed.
                      format: date-time
                      type: string
                    observedPorts:
                      description: |-
                        ObservedPorts lists destination ports seen for this hostname.
                        Left empty until connection-level observation (beyond DNS snooping)
                        is available -- a follow-on feature.
                      items:
                        format: int32
                        type: integer
                      type: array
                  required:
                  - firstSeen
                  - hostname
                  - lastSeen
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration lets us detect stale status vs spec.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
